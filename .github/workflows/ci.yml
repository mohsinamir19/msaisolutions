name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require package manifest
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json is missing. Add the app before relying on CI."
            exit 1
          fi

      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No lockfile found. Commit package-lock.json, yarn.lock, or pnpm-lock.yaml before relying on CI."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.manager }}" in
            pnpm)
              corepack enable pnpm
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable yarn
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "::error::Unknown package manager."
              exit 1
              ;;
          esac

      - name: Lint
        shell: bash
        run: |
          node -e "const pkg=require('./package.json'); if(!pkg.scripts||!pkg.scripts.lint){console.error('Missing lint script in package.json'); process.exit(1)}"
          npm run lint

      - name: Test
        shell: bash
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts&&pkg.scripts.test ? 0 : 1)"; then
            npm run test
          else
            echo "No test script defined; skipping tests."
          fi

      - name: Build
        shell: bash
        run: |
          node -e "const pkg=require('./package.json'); if(!pkg.scripts||!pkg.scripts.build){console.error('Missing build script in package.json'); process.exit(1)}"
          npm run build